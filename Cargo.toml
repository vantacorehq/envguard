[package]
name = "envguard"
version = "0.1.0"
edition = "2021"
description = "Check .env against .env.example and scan projects for leaked secrets. Zero dependencies."
license = "MIT"
readme = "README.md"
keywords = ["dotenv", "env", "secrets", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/vantacorehq/envguard"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
